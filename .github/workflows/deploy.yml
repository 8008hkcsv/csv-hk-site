name: Deploy to Sakura Server

# mainブランチに保存(push)されたら、さくらサーバーへFTPで自動アップロードする
on:
  push:
    branches: [main]
  workflow_dispatch:   # GitHub画面から手動実行も可能

concurrency:
  group: deploy-to-sakura
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: www/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
